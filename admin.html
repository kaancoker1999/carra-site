<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LUMIA — Admin</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --white:#FFFFFF; --paper:#FAF5EA; --ink:#14171A; --muted:#767A7E;
    --line:#E4E3DE; --line2:#D3D2CC; --bronze:#8A6220;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);
    font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
  h1,h2,h3{font-family:'Archivo',sans-serif;font-weight:600;letter-spacing:-.02em;margin:0}
  .mono{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .wrap{max-width:1100px;margin:0 auto;padding:36px 22px 100px}
  .card{background:var(--white);border:1px solid var(--line2);border-radius:14px;padding:24px 26px;margin:0 0 18px}
  label{display:block;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
  input,select,textarea{font:inherit;font-size:14.5px;padding:10px 12px;border:1px solid var(--line2);border-radius:9px;background:var(--white)}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ink)}
  .btn{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;
    background:var(--ink);color:#fff;border:0;border-radius:9px;padding:11px 18px;cursor:pointer}
  .btn:hover{background:var(--bronze)}
  .btn.ghost{background:var(--white);border:1px solid var(--line2);color:var(--ink)}

  /* ── orders calendar: pick a day, or a whole week from the left column ── */
  .cal{border:1px solid var(--line2);border-radius:12px;padding:14px;margin:0 0 12px}
  .calhead{display:flex;align-items:center;gap:10px;margin:0 0 10px;flex-wrap:wrap}
  .calmonth{font-family:'Archivo',sans-serif;font-weight:600;font-size:15px;min-width:150px;text-align:center}
  .calgrid{display:grid;grid-template-columns:54px repeat(7,1fr);gap:4px}
  .dow{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--muted);text-align:center;padding:4px 0}
  .cald,.calwk{font:inherit;border:1px solid var(--line);border-radius:8px;background:var(--white);cursor:pointer;
    padding:6px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12.5px}
  .cald:hover,.calwk:hover{border-color:var(--ink)}
  .cald.out{color:var(--line2);background:#FCFBF8}
  .cald.today{border-color:var(--bronze)}
  .cald.on,.calwk.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .cald .c{font-family:'IBM Plex Mono',monospace;font-size:9px;background:var(--paper);border-radius:999px;
    padding:0 6px;color:var(--ink)}
  .cald.on .c{background:rgba(255,255,255,.24);color:#fff}
  .calwk{background:var(--paper);font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.06em;color:var(--muted)}
  .calnote{font-size:11px}

  /* ── customer preview ── */
  .pvhead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin:0 0 16px}
  .pvname{font-family:'Archivo',sans-serif;font-weight:600;font-size:22px;letter-spacing:-.02em}
  .pvmeta{color:var(--muted);font-size:13px;margin-top:6px}
  .pvtiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:0 0 20px}
  .pvtile{border:1px solid var(--line2);border-radius:12px;background:var(--paper);padding:14px 16px}
  .pvtile .v{font-family:'Archivo',sans-serif;font-weight:600;font-size:21px;line-height:1.1}
  .pvtile .k{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--muted);margin-top:5px}
  .pvtile.due .v{color:#8A2620}
  .pvsub{font-family:'Archivo',sans-serif;font-weight:600;font-size:15px;margin:0 0 10px}
  .pvtabs{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
  .pvtab{font:inherit;font-size:13.5px;border:1px solid var(--line2);background:var(--white);color:var(--ink);
    padding:8px 14px;border-radius:9px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
  .pvtab:hover{border-color:var(--ink)}
  .pvtab.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .pvtab .n{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--muted);
    border:1px solid var(--line2);border-radius:999px;padding:1px 7px}
  .pvtab.on .n{color:#fff;border-color:rgba(255,255,255,.45)}
  .btn[disabled]{opacity:.5;cursor:wait}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
  .msg{font-size:13.5px;margin-top:10px}
  .msg.err{color:#8A2620}.msg.ok{color:#2F5D25}
  .tabs{display:flex;gap:10px;margin:22px 0 16px}
  .tab{font:inherit;font-size:14px;border:1px solid var(--line2);background:var(--white);border-radius:9px;padding:9px 18px;cursor:pointer}
  .tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  table{border-collapse:collapse;width:100%;font-size:13.5px}
  th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
  th{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:500}
  code{font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--bronze)}
  details{margin:2px 0}
  summary{cursor:pointer}
  .status{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;border-radius:999px;padding:3px 9px;white-space:nowrap}
  .st-pend{background:var(--paper);border:1px solid var(--line2);color:var(--muted)}
  .st-acc{background:#EFF6EC;border:1px solid #B9D4B0;color:#2F5D25}
  .st-canc{background:#FBEDEC;border:1px solid #E0B7B3;color:#8A2620}
  .pay-paid{background:#EFF6EC;border:1px solid #B9D4B0;color:#2F5D25}
  .pay-un{background:#FBF3E4;border:1px solid #E3C990;color:#8A6220}
  .dsum{display:flex;gap:22px;flex-wrap:wrap;padding:8px 2px 12px;border-bottom:1px solid var(--line);margin:0 0 10px}
  .dsum b{font-family:'Archivo',sans-serif;font-weight:600;font-size:16px}
  .dsum .k{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:block}
  .inactive{opacity:.5}
  .ordwrap{overflow-x:auto}
  .newcode{background:#FCF9F2;border:1px solid var(--bronze);border-radius:10px;padding:14px 16px;margin-top:14px;display:none}
  .newcode.on{display:block}
  .newcode code{font-size:16px}
  .confnote{font-size:12px;color:#8A2620;margin-top:6px;max-width:340px;line-height:1.45}
  .btn.armed{background:#8A2620!important;color:#fff!important;border-color:#8A2620!important}
</style>
</head>
<body>
<div class="wrap">
  <div class="mono">&mdash; LUMIA internal</div>
  <h1 style="font-size:28px;margin:8px 0 22px">Trade admin</h1>

  <div class="card" id="keycard">
    <label for="key">Admin key</label>
    <div class="row">
      <input id="key" type="password" style="min-width:320px" placeholder="LMA-ADMIN-…" autocomplete="off">
      <button class="btn" id="keybtn" type="button">Log in</button>
    </div>
    <div class="msg" id="keymsg"></div>
  </div>

  <div id="logoutbar" style="display:none;justify-content:flex-end;gap:10px;margin:0 0 14px">
    <button class="btn ghost" id="backupbtn" type="button">Download backup</button>
    <button class="btn ghost" id="logoutbtn" type="button">Log out</button>
  </div>

  <div id="panel" hidden>
    <div class="tabs">
      <button class="tab on" data-tab="orders" type="button">Orders</button>
      <button class="tab" data-tab="dealers" type="button">Customers</button>
    </div>

    <!-- ── orders ── -->
    <div id="tab-orders">
      <div class="card ordwrap">
        <div class="row" style="justify-content:space-between;align-items:center;margin-bottom:12px">
          <h2 style="font-size:18px">All orders</h2>
          <div class="row" style="gap:8px">
            <button class="btn ghost" id="csvbtn" type="button">Export CSV</button>
            <button class="btn ghost" id="refreshorders" type="button">Refresh</button>
          </div>
        </div>
        <div class="cal" id="cal"></div>
        <div class="calnote mono" id="calnote" style="margin:0 0 12px"></div>
        <table>
          <thead><tr><th>Date</th><th>Customer acct</th><th>End customer</th><th>Ref</th><th>Total</th><th>Lines</th><th>Status</th><th style="min-width:290px">Set status</th></tr></thead>
          <tbody id="orderrows"><tr><td colspan="8">Loading…</td></tr></tbody>
        </table>
      </div>
    </div>

    <!-- ── dealers ── -->
    <div id="tab-dealers" hidden>
      <!-- one customer, seen the way they see themselves -->
      <div class="card" id="dpreview" hidden></div>
      <div class="card" id="dcreate">
        <h2 style="font-size:18px;margin-bottom:14px">New customer account</h2>
        <div class="row">
          <div><label>Company / name</label><input id="d-name" type="text" style="min-width:260px" placeholder="Brooklyn Shades and Blind"></div>
          <div><label>E-mail (optional)</label><input id="d-email" type="email" style="min-width:200px" placeholder="orders@dealer.com"></div>
          <div><label>Phone (optional)</label><input id="d-phone" type="tel" style="min-width:150px" placeholder="718-276-0301"></div>
          <div><label>Address (optional)</label><input id="d-address" type="text" style="min-width:260px" placeholder="1554 61st Street, Brooklyn NY 11219"></div>
          <div><label>Price level (× base list)</label>
            <select id="d-mult">
              <option value="1">Base price (×1.00)</option>
              <option value="1.15">+15% (×1.15)</option>
              <option value="1.3">+30% (×1.30)</option>
              <option value="1.5">+50% (×1.50)</option>
            </select></div>
          <button class="btn" id="d-create" type="button">Create account</button>
        </div>
        <div class="newcode" id="newcode"></div>
        <div class="msg" id="dmsg"></div>
      </div>
      <div class="card ordwrap" id="dlist">
        <div class="row" style="justify-content:space-between;align-items:center;margin-bottom:12px">
          <h2 style="font-size:18px">Customer accounts</h2>
          <button class="btn ghost" id="refreshdealers" type="button">Refresh</button>
        </div>
        <table>
          <thead><tr><th>Name</th><th>Access code</th><th>Price level</th><th>Orders</th><th>Created</th><th>Status</th><th></th></tr></thead>
          <tbody id="dealerrows"><tr><td colspan="7">Loading…</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var KEY = 'lumia_admin_key';
  /* session-only: closing the tab forgets the key — the panel never
     shows anything without a fresh login */
  function key(){ return sessionStorage.getItem(KEY) || ''; }

  function api(path, method, body){
    return fetch(path, {
      method: method || 'GET',
      headers: { 'Authorization': 'Bearer ' + key(), 'Content-Type': 'application/json' },
      body: body ? JSON.stringify(body) : undefined
    }).then(function(r){
      if(r.status === 401) throw new Error('unauthorized');
      return r.json();
    });
  }

  function esc(t){ return String(t == null ? '' : t).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
  function fmtIn(v){
    var FR = {0:'0/8',1:'1/8',2:'1/4',3:'3/8',4:'1/2',5:'5/8',6:'3/4',7:'7/8'};
    var n = Math.floor(v), f = Math.round((v - n) * 8);
    if(f === 8){ n += 1; f = 0; }
    return n + ' ' + FR[f];
  }

  /* ── login ── */
  function unlock(){
    api('/api/admin/dealers').then(function(){
      $('panel').hidden = false;
      $('keycard').hidden = true;
      $('logoutbar').style.display = 'flex';
      /* dealers render per-account summaries from the order list — load orders first */
      loadOrders().then(loadDealers);
    }).catch(function(){
      sessionStorage.removeItem(KEY);
      $('panel').hidden = true;
      $('keymsg').className = 'msg err'; $('keymsg').textContent = 'Key rejected.';
    });
  }
  function logout(){
    sessionStorage.removeItem(KEY);
    $('panel').hidden = true;
    $('keycard').hidden = false;
    $('logoutbar').style.display = 'none';
    $('orderrows').innerHTML = '';
    $('dealerrows').innerHTML = '';
      $('keymsg').className = 'msg'; $('keymsg').textContent = '';
  }
  $('keybtn').addEventListener('click', function(){
    var v = $('key').value.trim();
    if(!v) return;
    sessionStorage.setItem(KEY, v); $('key').value = '';
    unlock();
  });
  $('key').addEventListener('keydown', function(e){ if(e.key === 'Enter') $('keybtn').click(); });
  $('logoutbtn').addEventListener('click', logout);
  if(key()) unlock();

  /* ── tabs ── */
  document.querySelectorAll('.tab').forEach(function(t){
    t.addEventListener('click', function(){
      document.querySelectorAll('.tab').forEach(function(x){ x.classList.toggle('on', x === t); });
      $('tab-orders').hidden = t.dataset.tab !== 'orders';
      $('tab-dealers').hidden = t.dataset.tab !== 'dealers';
    });
  });

  /* ── orders ── */
  var STATUSES = ['Pending review', 'Confirmed', 'In production', 'Shipped', 'On hold', 'Cancelled'];
  var allOrders = [];
  var calMonth = null;                          /* first of the month on screen */
  var calSel = { mode: 'all', key: '' };        /* all | day | week */
  function weekStart(dt){
    var d = new Date(dt); d.setHours(0,0,0,0);
    d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); /* back to Monday */
    return d;
  }
  /* local calendar date, not the UTC slice — an evening order must not jump a day */
  function ymd(dt){
    var d = new Date(dt);
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' +
           String(d.getDate()).padStart(2, '0');
  }
  function monthOf(dt){ var d = new Date(dt); return new Date(d.getFullYear(), d.getMonth(), 1); }
  function loadOrders(){
    return api('/api/admin/orders').then(function(d){
      allOrders = d.orders || [];
      if(!calMonth){
        /* open on the month of the newest order, so today's work is on screen */
        calMonth = monthOf(allOrders.length ? allOrders[0].at : new Date());
      }
      renderCalendar();
    }).catch(function(e){ $('orderrows').innerHTML = '<tr><td colspan="8">' + esc(e.message) + '</td></tr>'; });
  }

  function ordersOn(dayKey){
    return allOrders.filter(function(o){ return ymd(o.at) === dayKey; });
  }
  function ordersInWeek(mondayKey){
    return allOrders.filter(function(o){ return ymd(weekStart(o.at)) === mondayKey; });
  }
  function selectedOrders(){
    if(calSel.mode === 'day') return ordersOn(calSel.key);
    if(calSel.mode === 'week') return ordersInWeek(calSel.key);
    if(calSel.mode === 'range'){
      return allOrders.filter(function(o){
        var k = ymd(o.at);
        return k >= calSel.from && k <= calSel.to;      /* ISO dates compare as text */
      });
    }
    return allOrders;
  }
  function inSelection(key){
    if(calSel.mode === 'day') return key === calSel.key;
    if(calSel.mode === 'range') return key >= calSel.from && key <= calSel.to;
    return false;
  }
  function prettyDay(key, opts){
    return new Date(key + 'T12:00:00').toLocaleDateString('en-US', opts);
  }

  function renderCalendar(){
    var counts = {};
    allOrders.forEach(function(o){ var k = ymd(o.at); counts[k] = (counts[k] || 0) + 1; });

    var first = calMonth, todayKey = ymd(new Date());
    var head = '<div class="calhead">' +
      '<button class="btn ghost calnav" data-step="-1" type="button" style="padding:7px 12px">&lsaquo;</button>' +
      '<span class="calmonth">' + first.toLocaleDateString('en-US', {month:'long', year:'numeric'}) + '</span>' +
      '<button class="btn ghost calnav" data-step="1" type="button" style="padding:7px 12px">&rsaquo;</button>' +
      '<button class="btn ghost calweek" type="button" style="padding:7px 12px">This week</button>' +
      '<button class="btn' + (calSel.mode === 'all' ? '' : ' ghost') + ' calall" type="button" style="padding:7px 12px">All orders</button>' +
      '</div>';

    var grid = '<div class="calgrid"><div class="dow"></div>' +
      ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(function(d){ return '<div class="dow">' + d + '</div>'; }).join('');

    var cur = weekStart(first);                       /* Monday on or before the 1st */
    var last = new Date(first.getFullYear(), first.getMonth() + 1, 0);
    while(cur <= last){
      var mondayKey = ymd(cur);
      var wkN = ordersInWeek(mondayKey).length;
      grid += '<button class="calwk' + (calSel.mode === 'week' && calSel.key === mondayKey ? ' on' : '') +
        '" data-week="' + mondayKey + '" type="button" title="Whole week">' +
        cur.toLocaleDateString('en-US', {month:'short', day:'numeric'}) +
        (wkN ? '<span class="c">' + wkN + '</span>' : '') + '</button>';
      for(var i = 0; i < 7; i++){
        var day = new Date(cur.getFullYear(), cur.getMonth(), cur.getDate() + i);
        var key = ymd(day), n = counts[key] || 0;
        grid += '<button class="cald' +
          (day.getMonth() === first.getMonth() ? '' : ' out') +
          (key === todayKey ? ' today' : '') +
          (inSelection(key) ? ' on' : '') +
          '" data-day="' + key + '" type="button">' +
          '<span class="n">' + day.getDate() + '</span>' +
          (n ? '<span class="c">' + n + '</span>' : '') + '</button>';
      }
      cur = new Date(cur.getFullYear(), cur.getMonth(), cur.getDate() + 7);
    }
    $('cal').innerHTML = head + grid + '</div>';

    var list = selectedOrders();
    var when = calSel.mode === 'day'
      ? prettyDay(calSel.key, {weekday:'long', month:'long', day:'numeric', year:'numeric'})
      : calSel.mode === 'range'
        ? prettyDay(calSel.from, {month:'short', day:'numeric'}) + ' – ' +
          prettyDay(calSel.to, {month:'short', day:'numeric', year:'numeric'})
        : calSel.mode === 'week'
          ? 'week of ' + prettyDay(calSel.key, {month:'long', day:'numeric'})
          : 'all time';
    $('calnote').textContent = list.length + (list.length === 1 ? ' order · ' : ' orders · ') + when +
      (calSel.mode === 'day' ? ' · pick a second date for a range' : '');
    renderOrderRows(list);
  }

  $('cal').addEventListener('click', function(e){
    var nav = e.target.closest('.calnav');
    if(nav){
      var step = +nav.dataset.step;
      calMonth = step === 0 ? monthOf(new Date())
        : new Date(calMonth.getFullYear(), calMonth.getMonth() + step, 1);
      renderCalendar();
      return;
    }
    if(e.target.closest('.calweek')){
      var mon = ymd(weekStart(new Date()));
      calMonth = monthOf(new Date());
      calSel = { mode: 'week', key: mon };
      renderCalendar();
      return;
    }
    if(e.target.closest('.calall')){ calSel = { mode: 'all', key: '' }; renderCalendar(); return; }
    var wk = e.target.closest('.calwk');
    if(wk){
      calSel = (calSel.mode === 'week' && calSel.key === wk.dataset.week)
        ? { mode: 'all', key: '' } : { mode: 'week', key: wk.dataset.week };
      renderCalendar();
      return;
    }
    var day = e.target.closest('.cald');
    if(day){
      var k = day.dataset.day;
      if(calSel.mode === 'day' && calSel.key === k){
        calSel = { mode: 'all', key: '' };                  /* same date again clears it */
      } else if(calSel.mode === 'day'){
        /* a second date closes a range around the two */
        calSel = { mode: 'range', from: k < calSel.key ? k : calSel.key, to: k < calSel.key ? calSel.key : k };
      } else {
        calSel = { mode: 'day', key: k };                   /* start over from one date */
      }
      renderCalendar();
    }
  });
  function renderOrderRows(list){
    {
      var rows = (list || []).map(function(o, i){
        var st = o.status || { status: 'Pending review' };
        var paid = !!(o.payment && o.payment.paid);
        var rc = o.receipt || {};
        var done = !!(rc.dealerAt && rc.adminAt);   /* both sides agreed it arrived */
        var when = new Date(o.at);
        var lines = (o.lines || []).map(function(l, li){
          return (li+1) + '. ' + (l.label ? '[' + esc(l.label) + '] ' : '') + esc(l.product) + ' — ' + esc(l.spec) +
            ' — ' + (l.w == null ? 'by the yard' : fmtIn(l.w) + '″ × ' + fmtIn(l.h) + '″') + ' — qty ' + l.qty +
            (l.price != null ? ' — $' + (l.price * l.qty).toFixed(2) : ' — TBD');
        }).join('<br>');
        var sel = '<select data-ref="' + esc(o.ref) + '" class="st-sel">' + STATUSES.map(function(x){
          return '<option' + (x === st.status ? ' selected' : '') + '>' + x + '</option>';
        }).join('') + '</select>';
        return '<tr>' +
          '<td>' + when.toLocaleDateString('en-US', {month:'short', day:'numeric'}) + '<br><span class="mono" style="font-size:9px">' + when.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'}) + '</span></td>' +
          '<td>' + esc(o.dealer) + '</td>' +
          '<td>' + esc(o.customer || '—') + (o.notes ? '<br><span style="color:var(--muted);font-size:12px">' + esc(o.notes) + '</span>' : '') + '</td>' +
          '<td><code>' + esc(o.ref) + '</code>' + (o.kind === 'update' ? '<br><span class="mono" style="font-size:8.5px">updated</span>' : '') + '</td>' +

  /* two-step inline confirm — browser dialog blockers can't touch it */
  function note(b, text){
    var n = b.parentNode.querySelector('.confnote');
    if(!text){ if(n) n.remove(); return; }
    if(!n){ n = document.createElement('div'); n.className = 'confnote'; b.parentNode.appendChild(n); }
    n.textContent = text;
  }
  function armConfirm(b, message, fn){
    if(b.dataset.armed === '1'){
      b.dataset.armed = '';
      b.classList.remove('armed');
      b.textContent = b.dataset.orig;
      note(b, '');
      fn();
      return;
    }
    b.dataset.orig = b.textContent;
    b.dataset.armed = '1';
    b.classList.add('armed');
    b.textContent = 'Click again to confirm';
    note(b, message);
    setTimeout(function(){
      if(b.dataset.armed === '1'){
        b.dataset.armed = '';
        b.classList.remove('armed');
        b.textContent = b.dataset.orig;
        note(b, '');
      }
    }, 8000);
  }

  /* the same stages the customer sees on their own order page */
  var PV_STAGES = [
    { key: 'awaiting',   label: 'Awaiting',      empty: 'Nothing waiting for review.' },
    { key: 'production', label: 'In production', empty: 'Nothing in production.' },
    { key: 'shipped',    label: 'Shipped',       empty: 'Nothing on its way.' },
    { key: 'past',       label: 'Past orders',   empty: 'No completed orders yet.' },
    { key: 'cancelled',  label: 'Cancelled',     empty: 'No cancelled orders.' },
  ];
  var pvCode = '', pvStage = 'awaiting';

  function pvBuckets(code){
    var b = { awaiting: [], production: [], shipped: [], past: [], cancelled: [] };
    allOrders.forEach(function(o){
      if(o.code !== code) return;
      var st = (o.status && o.status.status) || 'Pending review';
      var rc = o.receipt || {};
      if(st === 'Cancelled') b.cancelled.push(o);
      else if(rc.dealerAt && rc.adminAt) b.past.push(o);      /* both sides confirmed delivery */
      else if(st === 'Pending review') b.awaiting.push(o);
      else if(st === 'Shipped') b.shipped.push(o);
      else b.production.push(o);
    });
    return b;
  }

  function openPreview(code, keepScroll){
    var d = dealersCache.filter(function(x){ return x.code === code; })[0];
    if(!d) return;

    var st = dealerStats(code);
    var pr = promoActive(d);
    var buckets = pvBuckets(code);
    if(!buckets[pvStage].length){
      var firstFull = PV_STAGES.filter(function(x){ return buckets[x.key].length; })[0];
      if(firstFull) pvStage = firstFull.key;
    }
    var mine = buckets[pvStage];
    var stage = PV_STAGES.filter(function(x){ return x.key === pvStage; })[0];

    var tile = function(v, k, cls){
      return '<div class="pvtile' + (cls ? ' ' + cls : '') + '"><div class="v">' + v + '</div><div class="k">' + k + '</div></div>';
    };
    var contact = [d.email, d.phone, d.address].filter(Boolean).map(esc).join(' · ');
    var rows = mine.map(function(o){
      var ost = o.status || { status: 'Pending review' };
      var rc = o.receipt || {};
      var paid = !!(o.payment && o.payment.paid);
      var t = orderTotals(o.lines);
      return '<tr>' +
        '<td>' + new Date(o.at).toLocaleDateString('en-US', {year:'numeric', month:'short', day:'numeric'}) + '</td>' +
        '<td>' + esc(o.customer || '—') + '</td>' +

        '<td>' + (o.lines || []).length + '</td>' +
        '<td>$' + t.total.toFixed(2) + '</td>' +
        '<td><span class="status ' + (ost.status === 'Pending review' ? 'st-pend'
          : (ost.status === 'Cancelled' ? 'st-canc' : 'st-acc')) + '">' + esc(ost.status) + '</span>' +
          (rc.dealerAt && rc.adminAt ? ' <span class="status st-acc">Completed</span>' : '') + '</td>' +
        '<td><span class="status ' + (paid ? 'pay-paid' : 'pay-un') + '">' + (paid ? 'Paid' : 'Unpaid') + '</span></td>' +
        '</tr>';
    }).join('');

    $('dpreview').innerHTML =
      '<div class="pvhead"><div>' +
        '<div class="pvname">' + esc(d.name) + '</div>' +
        '<div class="pvmeta"><code>' + esc(d.code) + '</code> · price level ×' + d.mult +
          (pr ? ' · −' + pr.pct + '% until ' + new Date(pr.until).toLocaleDateString('en-US', {month:'short', day:'numeric'}) : '') +
          ' · ' + (d.active === false ? 'suspended' : 'active') +
          (contact ? '<br>' + contact : '') + '</div>' +
      '</div><button class="btn ghost" id="pvback" type="button">&larr; All customers</button></div>' +
      '<div class="pvtiles">' +
        tile(st.n, 'Orders placed') +
        tile('$' + st.purch.toFixed(2), 'Total purchased') +
        tile('$' + st.due.toFixed(2), 'Balance due', st.due > 0 ? 'due' : '') +
        tile(st.shipped, 'In transit') +
        tile(st.prod, 'In production') +
        tile(st.pend, 'Awaiting review') +
      '</div>' +
      '<div class="pvsub">Their orders</div>' +
      '<div class="pvtabs">' + PV_STAGES.map(function(x){
        return '<button type="button" class="pvtab' + (x.key === pvStage ? ' on' : '') + '" data-stage="' + x.key + '">' +
          x.label + '<span class="n">' + buckets[x.key].length + '</span></button>';
      }).join('') + '</div>' +
      (mine.length
        ? '<div class="ordwrap"><table><thead><tr><th>Date</th><th>End customer</th><th>Ref</th><th>Lines</th>' +
          '<th>Total</th><th>Status</th><th>Payment</th></tr></thead><tbody>' + rows + '</tbody></table></div>'
        : '<p class="mono">' + stage.empty + '</p>');

    $('dpreview').hidden = false;
    $('dcreate').hidden = true;
    $('dlist').hidden = true;
    if(!keepScroll) $('dpreview').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
  $('dpreview').addEventListener('click', function(e){
    if(e.target.closest('#pvback')){ closePreview(); return; }
    var t = e.target.closest('.pvtab');
    if(t){ pvStage = t.dataset.stage; openPreview(pvCode, true); }
  });

  $('dealerrows').addEventListener('click', function(e){
    var b;
    if((b = e.target.closest('.d-preview'))){ openPreview(b.dataset.code); return; }
    if((b = e.target.closest('.d-edit'))){
      var row = document.querySelector('.editrow[data-for="' + b.dataset.i + '"]');
      if(row) row.hidden = !row.hidden;
      return;
    }
    if((b = e.target.closest('.d-toggle'))){
      var verb = b.dataset.active === 'true' ? 'reactivate' : 'suspend';
      var tb = b;
      armConfirm(tb, 'This will ' + verb + ' ' + dealerName(tb.dataset.code) +
        (verb === 'suspend' ? ' — their login stops working immediately.' : ' — their login starts working again.'), function(){
        tb.disabled = true;
        api('/api/admin/dealer-active', 'POST', { code: tb.dataset.code, active: tb.dataset.active === 'true' })
          .then(loadDealers).catch(function(){ tb.disabled = false; note(tb, 'Failed — try again.'); });
      });
      return;
    }
    if((b = e.target.closest('.e-mult-save'))){
      var mb = b;
      var sel = document.querySelector('.e-mult[data-code="' + mb.dataset.code + '"]');
      var label = sel.options[sel.selectedIndex].text;
      armConfirm(mb, 'Change ' + dealerName(mb.dataset.code) + "'s price level to " + label +
        '. They will see the new prices on their next login.', function(){
        mb.disabled = true;
        api('/api/admin/dealer-mult', 'POST', { code: mb.dataset.code, mult: parseFloat(sel.value) })
          .then(loadDealers).catch(function(){ mb.disabled = false; note(mb, 'Failed — try again.'); });
      });
      return;
    }
    if((b = e.target.closest('.e-promo-save'))){
      var pb = b;
      var pct = parseFloat(document.querySelector('.e-pct[data-code="' + pb.dataset.code + '"]').value);
      var days = parseInt(document.querySelector('.e-days[data-code="' + pb.dataset.code + '"]').value, 10);
      if(!isFinite(pct) || pct <= 0 || !isFinite(days) || days < 1){ note(pb, 'Enter a percent and a number of days first.'); return; }
      var until = new Date(Date.now() + days * 86400000).toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'});
      armConfirm(pb, 'Give ' + dealerName(pb.dataset.code) + ' a ' + pct + '% discount for ' + days +
        ' days (until ' + until + '). It ends automatically.', function(){
        pb.disabled = true;
        api('/api/admin/dealer-promo', 'POST', { code: pb.dataset.code, pct: pct, days: days })
          .then(loadDealers).catch(function(){ pb.disabled = false; note(pb, 'Failed — try again.'); });
      });
      return;
    }
    if((b = e.target.closest('.e-promo-clear'))){
      var cb = b;
      armConfirm(cb, 'Remove the discount from ' + dealerName(cb.dataset.code) + '.', function(){
        cb.disabled = true;
        api('/api/admin/dealer-promo', 'POST', { code: cb.dataset.code, pct: 0 })
          .then(loadDealers).catch(function(){ cb.disabled = false; note(cb, 'Failed — try again.'); });
      });
      return;
    }
    if((b = e.target.closest('.e-contact-save'))){
      var eb = b;
      var pick = function(cls){ return document.querySelector(cls + '[data-code="' + eb.dataset.code + '"]').value.trim(); };
      eb.disabled = true;
      api('/api/admin/dealer-contact', 'POST', { code: eb.dataset.code,
        email: pick('.e-email'), phone: pick('.e-phone'), address: pick('.e-address') })
        .then(function(){ eb.disabled = false; note(eb, ''); eb.textContent = 'Saved ✓';
          setTimeout(function(){ eb.textContent = 'Save contact'; loadDealers(); }, 1200); })
        .catch(function(){ eb.disabled = false; note(eb, 'Failed — try again.'); });
      return;
    }
    if((b = e.target.closest('.e-delete'))){
      var db = b;
      armConfirm(db, 'This DELETES "' + dealerName(db.dataset.code) +
        '" — their access code stops working immediately. Past orders are kept.', function(){
        db.disabled = true;
        api('/api/admin/dealer-delete', 'POST', { code: db.dataset.code })
          .then(loadDealers).catch(function(){ db.disabled = false; note(db, 'Failed — try again.'); });
      });
      return;
    }
  });
})();
</script>
</body>
</html>

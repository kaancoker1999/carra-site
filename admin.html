<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LUMIA — Admin</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --white:#FFFFFF; --paper:#FAF5EA; --ink:#14171A; --muted:#767A7E;
    --line:#E4E3DE; --line2:#D3D2CC; --bronze:#8A6220;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);
    font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
  h1,h2,h3{font-family:'Archivo',sans-serif;font-weight:600;letter-spacing:-.02em;margin:0}
  .mono{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .wrap{max-width:1100px;margin:0 auto;padding:36px 22px 100px}
  .card{background:var(--white);border:1px solid var(--line2);border-radius:14px;padding:24px 26px;margin:0 0 18px}
  label{display:block;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
  input,select,textarea{font:inherit;font-size:14.5px;padding:10px 12px;border:1px solid var(--line2);border-radius:9px;background:var(--white)}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ink)}
  .btn{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;
    background:var(--ink);color:#fff;border:0;border-radius:9px;padding:11px 18px;cursor:pointer}
  .btn:hover{background:var(--bronze)}
  .btn.ghost{background:var(--white);border:1px solid var(--line2);color:var(--ink)}
  .btn[disabled]{opacity:.5;cursor:wait}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
  .msg{font-size:13.5px;margin-top:10px}
  .msg.err{color:#8A2620}.msg.ok{color:#2F5D25}
  .tabs{display:flex;gap:10px;margin:22px 0 16px}
  .tab{font:inherit;font-size:14px;border:1px solid var(--line2);background:var(--white);border-radius:9px;padding:9px 18px;cursor:pointer}
  .tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  table{border-collapse:collapse;width:100%;font-size:13.5px}
  th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
  th{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:500}
  code{font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--bronze)}
  details{margin:2px 0}
  summary{cursor:pointer}
  .status{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;border-radius:999px;padding:3px 9px;white-space:nowrap}
  .st-pend{background:var(--paper);border:1px solid var(--line2);color:var(--muted)}
  .st-acc{background:#EFF6EC;border:1px solid #B9D4B0;color:#2F5D25}
  .inactive{opacity:.5}
  .ordwrap{overflow-x:auto}
  .newcode{background:#FCF9F2;border:1px solid var(--bronze);border-radius:10px;padding:14px 16px;margin-top:14px;display:none}
  .newcode.on{display:block}
  .newcode code{font-size:16px}
  .confnote{font-size:12px;color:#8A2620;margin-top:6px;max-width:340px;line-height:1.45}
  .btn.armed{background:#8A2620!important;color:#fff!important;border-color:#8A2620!important}
</style>
</head>
<body>
<div class="wrap">
  <div class="mono">&mdash; LUMIA internal</div>
  <h1 style="font-size:28px;margin:8px 0 22px">Trade admin</h1>

  <div class="card" id="keycard">
    <label for="key">Admin key</label>
    <div class="row">
      <input id="key" type="password" style="min-width:320px" placeholder="LMA-ADMIN-…" autocomplete="off">
      <button class="btn" id="keybtn" type="button">Log in</button>
    </div>
    <div class="msg" id="keymsg"></div>
  </div>

  <div id="logoutbar" style="display:none;justify-content:flex-end;gap:10px;margin:0 0 14px">
    <button class="btn ghost" id="backupbtn" type="button">Download backup</button>
    <button class="btn ghost" id="logoutbtn" type="button">Log out</button>
  </div>

  <div id="panel" hidden>
    <div class="tabs">
      <button class="tab on" data-tab="orders" type="button">Orders</button>
      <button class="tab" data-tab="dealers" type="button">Customers</button>
    </div>

    <!-- ── orders ── -->
    <div id="tab-orders">
      <div class="card ordwrap">
        <div class="row" style="justify-content:space-between;align-items:center;margin-bottom:12px">
          <h2 style="font-size:18px">All orders</h2>
          <div class="row" style="gap:8px">
            <button class="btn ghost" id="csvbtn" type="button">Export CSV</button>
            <button class="btn ghost" id="refreshorders" type="button">Refresh</button>
          </div>
        </div>
        <div class="tabs" id="weektabs" style="margin:0 0 14px;flex-wrap:wrap"></div>
        <table>
          <thead><tr><th>Date</th><th>Customer acct</th><th>End customer</th><th>Ref</th><th>Total</th><th>Lines</th><th>Status</th><th style="min-width:290px">Set status</th></tr></thead>
          <tbody id="orderrows"><tr><td colspan="8">Loading…</td></tr></tbody>
        </table>
      </div>
    </div>

    <!-- ── dealers ── -->
    <div id="tab-dealers" hidden>
      <div class="card">
        <h2 style="font-size:18px;margin-bottom:14px">New customer account</h2>
        <div class="row">
          <div><label>Company / name</label><input id="d-name" type="text" style="min-width:260px" placeholder="Brooklyn Shades and Blind"></div>
          <div><label>E-mail (optional)</label><input id="d-email" type="email" style="min-width:200px" placeholder="orders@dealer.com"></div>
          <div><label>Phone (optional)</label><input id="d-phone" type="tel" style="min-width:150px" placeholder="718-276-0301"></div>
          <div><label>Address (optional)</label><input id="d-address" type="text" style="min-width:260px" placeholder="1554 61st Street, Brooklyn NY 11219"></div>
          <div><label>Price level (× base list)</label>
            <select id="d-mult">
              <option value="1">Base price (×1.00)</option>
              <option value="1.15">+15% (×1.15)</option>
              <option value="1.3">+30% (×1.30)</option>
              <option value="1.5">+50% (×1.50)</option>
            </select></div>
          <button class="btn" id="d-create" type="button">Create account</button>
        </div>
        <div class="newcode" id="newcode"></div>
        <div class="msg" id="dmsg"></div>
      </div>
      <div class="card ordwrap">
        <div class="row" style="justify-content:space-between;align-items:center;margin-bottom:12px">
          <h2 style="font-size:18px">Customer accounts</h2>
          <button class="btn ghost" id="refreshdealers" type="button">Refresh</button>
        </div>
        <table>
          <thead><tr><th>Name</th><th>Access code</th><th>Price level</th><th>Orders</th><th>Created</th><th>Status</th><th></th></tr></thead>
          <tbody id="dealerrows"><tr><td colspan="7">Loading…</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var KEY = 'lumia_admin_key';
  /* session-only: closing the tab forgets the key — the panel never
     shows anything without a fresh login */
  function key(){ return sessionStorage.getItem(KEY) || ''; }

  function api(path, method, body){
    return fetch(path, {
      method: method || 'GET',
      headers: { 'Authorization': 'Bearer ' + key(), 'Content-Type': 'application/json' },
      body: body ? JSON.stringify(body) : undefined
    }).then(function(r){
      if(r.status === 401) throw new Error('unauthorized');
      return r.json();
    });
  }

  function esc(t){ return String(t == null ? '' : t).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
  function fmtIn(v){
    var FR = {0:'0/8',1:'1/8',2:'1/4',3:'3/8',4:'1/2',5:'5/8',6:'3/4',7:'7/8'};
    var n = Math.floor(v), f = Math.round((v - n) * 8);
    if(f === 8){ n += 1; f = 0; }
    return n + ' ' + FR[f];
  }

  /* ── login ── */
  function unlock(){
    api('/api/admin/dealers').then(function(){
      $('panel').hidden = false;
      $('keycard').hidden = true;
      $('logoutbar').style.display = 'flex';
      loadOrders(); loadDealers();
    }).catch(function(){
      sessionStorage.removeItem(KEY);
      $('panel').hidden = true;
      $('keymsg').className = 'msg err'; $('keymsg').textContent = 'Key rejected.';
    });
  }
  function logout(){
    sessionStorage.removeItem(KEY);
    $('panel').hidden = true;
    $('keycard').hidden = false;
    $('logoutbar').style.display = 'none';
    $('orderrows').innerHTML = '';
    $('dealerrows').innerHTML = '';
    $('weektabs').innerHTML = '';
    $('keymsg').className = 'msg'; $('keymsg').textContent = '';
  }
  $('keybtn').addEventListener('click', function(){
    var v = $('key').value.trim();
    if(!v) return;
    sessionStorage.setItem(KEY, v); $('key').value = '';
    unlock();
  });
  $('key').addEventListener('keydown', function(e){ if(e.key === 'Enter') $('keybtn').click(); });
  $('logoutbtn').addEventListener('click', logout);
  if(key()) unlock();

  /* ── tabs ── */
  document.querySelectorAll('.tab').forEach(function(t){
    t.addEventListener('click', function(){
      document.querySelectorAll('.tab').forEach(function(x){ x.classList.toggle('on', x === t); });
      $('tab-orders').hidden = t.dataset.tab !== 'orders';
      $('tab-dealers').hidden = t.dataset.tab !== 'dealers';
    });
  });

  /* ── orders ── */
  var STATUSES = ['Pending review', 'Confirmed', 'In production', 'Shipped', 'On hold', 'Cancelled'];
  var allOrders = [], weekSel = 0;
  function weekStart(dt){
    var d = new Date(dt); d.setHours(0,0,0,0);
    d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); /* back to Monday */
    return d;
  }
  function weekLabel(mondayIso){
    var a = new Date(mondayIso), b = new Date(a); b.setDate(b.getDate() + 6);
    var now = weekStart(new Date()).toISOString().slice(0,10);
    if(mondayIso === now) return 'This week';
    var f = function(x){ return x.toLocaleDateString('en-US', {month:'short', day:'numeric'}); };
    return f(a) + ' – ' + f(b);
  }
  function loadOrders(){
    api('/api/admin/orders').then(function(d){
      allOrders = d.orders || [];
      renderWeeks();
    }).catch(function(e){ $('orderrows').innerHTML = '<tr><td colspan="8">' + esc(e.message) + '</td></tr>'; });
  }
  function renderWeeks(){
    var byWeek = {}, keys = [];
    allOrders.forEach(function(o){
      var k = weekStart(o.at).toISOString().slice(0,10);
      if(!byWeek[k]){ byWeek[k] = []; keys.push(k); }
      byWeek[k].push(o);
    });
    keys.sort().reverse();
    if(weekSel >= keys.length) weekSel = 0;
    $('weektabs').innerHTML = keys.map(function(k, i){
      return '<button class="tab' + (i === weekSel ? ' on' : '') + '" data-w="' + i + '" type="button" style="padding:7px 14px;font-size:13px">' +
        weekLabel(k) + ' <span class="mono" style="font-size:9px">' + byWeek[k].length + '</span></button>';
    }).join('') || '<span class="mono">No orders yet.</span>';
    renderOrderRows(keys.length ? byWeek[keys[weekSel]] : []);
  }
  $('weektabs') && document.getElementById('weektabs').addEventListener('click', function(e){
    var b = e.target.closest('.tab'); if(!b) return;
    weekSel = +b.dataset.w; renderWeeks();
  });
  function renderOrderRows(list){
    {
      var rows = (list || []).map(function(o, i){
        var st = o.status || { status: 'Pending review' };
        var when = new Date(o.at);
        var lines = (o.lines || []).map(function(l, li){
          return (li+1) + '. ' + (l.label ? '[' + esc(l.label) + '] ' : '') + esc(l.product) + ' — ' + esc(l.spec) +
            ' — ' + (l.w == null ? 'by the yard' : fmtIn(l.w) + '″ × ' + fmtIn(l.h) + '″') + ' — qty ' + l.qty +
            (l.price != null ? ' — $' + (l.price * l.qty).toFixed(2) : ' — TBD');
        }).join('<br>');
        var sel = '<select data-ref="' + esc(o.ref) + '" class="st-sel">' + STATUSES.map(function(x){
          return '<option' + (x === st.status ? ' selected' : '') + '>' + x + '</option>';
        }).join('') + '</select>';
        return '<tr>' +
          '<td>' + when.toLocaleDateString('en-US', {month:'short', day:'numeric'}) + '<br><span class="mono" style="font-size:9px">' + when.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'}) + '</span></td>' +
          '<td>' + esc(o.dealer) + '</td>' +
          '<td>' + esc(o.customer || '—') + (o.notes ? '<br><span style="color:var(--muted);font-size:12px">' + esc(o.notes) + '</span>' : '') + '</td>' +
          '<td><code>' + esc(o.ref) + '</code>' + (o.kind === 'update' ? '<br><span class="mono" style="font-size:8.5px">updated</span>' : '') + '</td>' +
          '<td>' + esc(o.total || '') + '</td>' +
          '<td><details><summary>' + (o.lines || []).length + ' lines</summary><div style="font-size:12.5px;padding:6px 0">' + lines + '</div></details></td>' +
          '<td><span class="status ' + (st.status === 'Pending review' ? 'st-pend' : 'st-acc') + '">' + (st.locked ? '🔒 ' : '') + esc(st.status) + '</span>' +
            (st.note ? '<br><span style="font-size:11.5px;color:#2F5D25">' + esc(st.note) + '</span>' : '') + '</td>' +
          '<td><div class="row" style="gap:6px">' + sel +
            '<label style="display:flex;align-items:center;gap:4px;margin:0;font-size:10px"><input type="checkbox" class="st-lock" data-ref="' + esc(o.ref) + '"' + (st.locked ? ' checked' : '') + '>lock</label></div>' +
            '<input type="text" class="st-note" data-ref="' + esc(o.ref) + '" placeholder="note to customer" value="' + esc(st.note || '') + '" style="width:100%;margin-top:6px;font-size:12.5px">' +
            '<div class="row" style="gap:6px;margin-top:6px"><button class="btn st-save" data-ref="' + esc(o.ref) + '" type="button" style="padding:7px 14px">Save</button>' +
            '<button class="btn ghost o-inv" data-ref="' + esc(o.ref) + '" type="button" style="padding:7px 14px">Invoice</button></div></td>' +
          '</tr>';
      }).join('');
      $('orderrows').innerHTML = rows || '<tr><td colspan="8">No orders this week.</td></tr>';
    }
  }
  $('refreshorders').addEventListener('click', loadOrders);
  $('orderrows').addEventListener('click', function(e){
    var b = e.target.closest('.st-save'); if(!b) return;
    var ref = b.dataset.ref;
    var sel = document.querySelector('.st-sel[data-ref="' + ref + '"]') || document.querySelector('.st-sel');
    var find = function(cls){ return [].slice.call(document.querySelectorAll(cls)).filter(function(x){ return x.dataset.ref === ref; })[0]; };
    b.disabled = true;
    api('/api/admin/status', 'POST', {
      ref: ref,
      status: find('.st-sel') ? find('.st-sel').value : 'Pending review',
      locked: find('.st-lock') ? find('.st-lock').checked : false,
      note: find('.st-note') ? find('.st-note').value : ''
    }).then(function(){ loadOrders(); }).catch(function(){ b.disabled = false; alert('Save failed'); });
  });

  /* ── dealers ── */
  $('d-create').addEventListener('click', function(){
    var name = $('d-name').value.trim();
    var mult = parseFloat($('d-mult').value);
    if(!name){ $('dmsg').className = 'msg err'; $('dmsg').textContent = 'Name required.'; return; }
    if(!isFinite(mult) || mult <= 0){ $('dmsg').className = 'msg err'; $('dmsg').textContent = 'Multiplier required.'; return; }
    var b = this; b.disabled = true;
    api('/api/admin/dealers', 'POST', { name: name, mult: mult, email: $('d-email').value.trim(),
      phone: $('d-phone').value.trim(), address: $('d-address').value.trim() }).then(function(d){
      b.disabled = false; $('d-name').value = ''; $('d-email').value = ''; $('d-phone').value = ''; $('d-address').value = '';
      $('dmsg').className = 'msg';
      $('newcode').className = 'newcode on';
      $('newcode').innerHTML = '<b>' + esc(d.name) + '</b> created — access code: <code>' + esc(d.code) + '</code><br>' +
        '<span style="font-size:12.5px;color:var(--muted)">Send this code to the customer — it is their login. Price level ×' + d.mult + '.</span>';
      loadDealers();
    }).catch(function(){ b.disabled = false; $('dmsg').className = 'msg err'; $('dmsg').textContent = 'Create failed.'; });
  });
  var LEVELS = [['1','Base price (×1.00)'],['1.15','+15% (×1.15)'],['1.3','+30% (×1.30)'],['1.5','+50% (×1.50)']];
  var dealersCache = [];
  function promoActive(x){
    return x.promo && x.promo.until && new Date(x.promo.until) > new Date() ? x.promo : null;
  }
  function loadDealers(){
    api('/api/admin/dealers').then(function(d){
      dealersCache = d.dealers || [];
      var rows = dealersCache.map(function(x, xi){
        var pr = promoActive(x);
        var priceCell = '×' + x.mult +
          (pr ? '<br><span style="color:#2F5D25;font-size:11.5px">−' + pr.pct + '% until ' +
            new Date(pr.until).toLocaleDateString('en-US', {month:'short', day:'numeric'}) + '</span>' : '');
        var main = '<tr class="' + (x.active === false ? 'inactive' : '') + '">' +
          '<td>' + esc(x.name) + ((x.email || x.phone) ? '<br><span style="color:var(--muted);font-size:12px">' +
            esc([x.email, x.phone].filter(Boolean).join(' · ')) + '</span>' : '') + '</td>' +
          '<td><code>' + esc(x.code) + '</code></td>' +
          '<td>' + priceCell + '</td>' +
          '<td>' + x.orders + '</td>' +
          '<td>' + (x.created ? new Date(x.created).toLocaleDateString('en-US', {year:'numeric',month:'short',day:'numeric'}) : '—') + '</td>' +
          '<td>' + (x.active === false ? 'Suspended' : 'Active') + '</td>' +
          '<td><div class="row" style="gap:6px">' +
            '<button class="btn ghost d-edit" data-i="' + xi + '" type="button" style="padding:6px 12px">Manage</button>' +
            '<button class="btn ghost d-toggle" data-code="' + esc(x.code) + '" data-active="' + (x.active === false ? 'true' : 'false') + '" type="button" style="padding:6px 12px">' +
            (x.active === false ? 'Reactivate' : 'Suspend') + '</button></div></td></tr>';
        var editor = '<tr class="editrow" data-for="' + xi + '" hidden><td colspan="7" style="background:var(--paper)">' +
          '<div class="row" style="gap:22px;align-items:flex-end;padding:6px 0">' +
          '<div><label>Price level</label><select class="e-mult" data-code="' + esc(x.code) + '">' +
            LEVELS.map(function(l){ return '<option value="' + l[0] + '"' + (String(x.mult) === l[0] ? ' selected' : '') + '>' + l[1] + '</option>'; }).join('') +
          '</select> <button class="btn e-mult-save" data-code="' + esc(x.code) + '" type="button" style="padding:8px 14px">Change price</button></div>' +
          '<div><label>Timed discount</label>' +
            '<input class="e-pct" data-code="' + esc(x.code) + '" type="number" min="1" max="90" step="0.5" placeholder="%" style="width:76px" value="' + (pr ? pr.pct : '') + '"> ' +
            '<input class="e-days" data-code="' + esc(x.code) + '" type="number" min="1" max="365" step="1" placeholder="days" style="width:86px"> ' +
            '<button class="btn e-promo-save" data-code="' + esc(x.code) + '" type="button" style="padding:8px 14px">Apply discount</button>' +
            (pr ? ' <button class="btn ghost e-promo-clear" data-code="' + esc(x.code) + '" type="button" style="padding:8px 14px">Remove discount</button>' : '') +
          '</div>' +
          '<div><label>Contact</label>' +
            '<input class="e-email" data-code="' + esc(x.code) + '" type="email" placeholder="e-mail" value="' + esc(x.email || '') + '" style="width:180px"> ' +
            '<input class="e-phone" data-code="' + esc(x.code) + '" type="tel" placeholder="phone" value="' + esc(x.phone || '') + '" style="width:130px"> ' +
            '<input class="e-address" data-code="' + esc(x.code) + '" type="text" placeholder="address" value="' + esc(x.address || '') + '" style="width:240px"> ' +
            '<button class="btn ghost e-contact-save" data-code="' + esc(x.code) + '" type="button" style="padding:8px 14px">Save contact</button></div>' +
          '<div style="margin-left:auto"><button class="btn e-delete" data-code="' + esc(x.code) + '" type="button" style="background:#8A2620;padding:8px 14px">Delete account</button></div>' +
          '</div></td></tr>';
        return main + editor;
      }).join('');
      $('dealerrows').innerHTML = rows || '<tr><td colspan="7">No customer accounts yet.</td></tr>';
    }).catch(function(e){ $('dealerrows').innerHTML = '<tr><td colspan="7">' + esc(e.message) + '</td></tr>'; });
  }
  $('refreshdealers').addEventListener('click', loadDealers);

  /* ── backup: everything as one JSON file ── */
  function download(filename, text, type){
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type: type || 'application/json' }));
    a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
  }
  $('backupbtn').addEventListener('click', function(){
    var b = this; b.disabled = true; b.textContent = 'Preparing…';
    api('/api/admin/backup').then(function(d){
      download('lumia-backup-' + new Date().toISOString().slice(0,10) + '.json', JSON.stringify(d, null, 1));
      b.disabled = false; b.textContent = 'Download backup';
    }).catch(function(){ b.disabled = false; b.textContent = 'Download backup'; alert('Backup failed'); });
  });

  /* ── orders CSV for accounting ── */
  function csvCell(v){
    v = String(v == null ? '' : v);
    return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
  }
  $('csvbtn').addEventListener('click', function(){
    var rows = [['Date','Ref','Customer account','End customer','Lines','Units','Total','Status','Locked','Note','Order notes']];
    allOrders.forEach(function(o){
      var units = (o.lines || []).reduce(function(a,l){ return a + (l.qty || 0); }, 0);
      var st = o.status || {};
      rows.push([o.at.slice(0,10), o.ref, o.dealer, o.customer || '', (o.lines || []).length, units,
        o.total || '', st.status || '', st.locked ? 'yes' : '', st.note || '', o.notes || '']);
    });
    var csv = rows.map(function(r){ return r.map(csvCell).join(','); }).join('\n');
    download('lumia-orders-' + new Date().toISOString().slice(0,10) + '.csv', csv, 'text/csv');
  });

  /* ── invoice from the admin side (same layout as the dealer one) ── */
  function orderTotals(ls){
    var units = 0, total = 0, unknown = 0;
    (ls || []).forEach(function(l){
      units += l.qty || 0;
      if(l.price == null){ unknown += 1; } else { total += l.price * l.qty; }
    });
    return { units: units, total: Math.round(total * 100) / 100, unknown: unknown };
  }
  function openInvoice(o){
    var dl = dealersCache.filter(function(x){ return x.code === o.code; })[0] || {};
    var t = orderTotals(o.lines);
    var d = new Date(o.at);
    var dts = (d.getMonth()+1) + '.' + d.getDate() + '.' + d.getFullYear();
    var rows = (o.lines || []).map(function(l, i){
      var m = (l.spec || '').match(/(?:Fabric|Cell & opacity|Style): ([^·]+)/) ||
              (l.spec || '').match(/^[^:]+: ([^·]+)/);
      var desc = esc(l.product) + ' — ' + esc(m ? m[1].trim() : '');
      return '<tr><td>' + (i+1) + '</td><td class="l">' + desc + '</td>' +
        '<td>' + (l.w == null ? '—' : fmtIn(l.w)) + '</td><td>' + (l.h == null ? '—' : fmtIn(l.h)) + '</td><td>' + esc(l.label || '') + '</td>' +
        '<td>' + l.qty + '</td><td class="r">' + (l.price == null ? 'TBD' : '$' + l.price.toFixed(2)) + '</td>' +
        '<td class="r">' + (l.price == null ? 'TBD' : '$' + (l.price * l.qty).toFixed(2)) + '</td></tr>';
    }).join('');
    var html = '<!doctype html><html><head><meta charset="utf-8"><title>Invoice ' + esc(o.ref) + '</title><style>' +
      'body{font-family:Arial,Helvetica,sans-serif;font-size:12px;color:#111;margin:40px auto;max-width:760px;padding:0 20px}' +
      'h1{font-size:15px;margin:0}.right{text-align:right}' +
      '.top{display:flex;justify-content:space-between;margin-bottom:26px}' +
      '.inv{font-size:15px;font-weight:bold}' +
      '.blocks{display:flex;gap:60px;margin-bottom:26px}' +
      '.blocks h2{font-size:12px;margin:0 0 6px}' +
      '.blocks div p{margin:2px 0}' +
      '[contenteditable]{outline:1px dashed #bbb;min-width:120px;padding:1px 3px}' +
      'table{border-collapse:collapse;width:100%;font-size:11.5px}' +
      'th,td{border:1px solid #333;padding:6px 8px;text-align:center}' +
      'th{background:#d9d9d9}td.l{text-align:left}td.r{text-align:right}' +
      '.total{text-align:right;font-size:13px;font-weight:bold;margin:18px 0 30px}' +
      '.foot{text-align:center;font-size:11px;margin-top:34px}' +
      '.printbtn{position:fixed;top:14px;right:14px;padding:10px 18px;font-size:12px;cursor:pointer}' +
      '@media print{.printbtn{display:none}[contenteditable]{outline:none}}' +
      '</style></head><body>' +
      '<button class="printbtn" onclick="print()">Print / save PDF</button>' +
      '<div class="top"><div><h1>TDC PRODUCTS LLC</h1>' +
      '<p style="margin:2px 0"><b>7907 Candle Lane, Houston, TX 77071 U.S.A.</b></p>' +
      '<p style="margin:2px 0"><b>hello@lumiashades.com</b></p></div>' +
      '<div class="right"><div class="inv">INVOICE</div>' +
      '<p style="margin:2px 0">No.: <span contenteditable>' + esc(o.ref.replace(/\D/g,'').slice(-6)) + '</span></p>' +
      '<p style="margin:2px 0">Date: ' + dts + '</p></div></div>' +
      '<div class="blocks"><div><h2>BILLED TO:</h2>' +
      '<p><span contenteditable>' + esc(o.dealer || 'Customer') + '</span></p>' +
      '<p><span contenteditable>' + esc(dl.address || 'Street address, City, State ZIP') + '</span></p>' +
      '<p><span contenteditable>' + esc(dl.phone ? 'Phone: ' + dl.phone : '&nbsp;') + '</span></p></div>' +
      '<div><h2>PO DETAILS:</h2>' +
      '<p>PO # ' + esc(o.ref) + '</p>' +
      '<p>PO Date ' + dts + '</p>' +
      '<p>Sidemark <span contenteditable>' + esc(o.customer || '') + '</span></p>' +
      '<p>Ship Ref. <span contenteditable>&nbsp;</span></p>' +
      '<p>Ship Date <span contenteditable>&nbsp;</span></p></div></div>' +
      '<table><thead><tr><th>#</th><th>Description</th><th>Width</th><th>Height</th><th>Room</th><th>Qty</th><th>Price</th><th>Amount</th></tr></thead>' +
      '<tbody>' + rows + '</tbody></table>' +
      '<p class="total">TOTAL&nbsp;&nbsp;$ ' + t.total.toFixed(2) + (t.unknown ? ' + ' + t.unknown + ' line(s) TBD' : '') + '</p>' +
      (o.notes ? '<p style="font-size:11px"><b>Notes:</b> ' + esc(o.notes) + '</p>' : '') +
      '<div class="foot">DIRECT ALL INQUIRIES TO hello@lumiashades.com<br><b>THANK YOU FOR YOUR COOPERATION</b></div>' +
      '</body></html>';
    var win = window.open('', '_blank');
    if(!win){ alert('Allow pop-ups for this site to open the invoice.'); return; }
    win.document.write(html);
    win.document.close();
  }
  $('orderrows').addEventListener('click', function(e){
    var b = e.target.closest('.o-inv'); if(!b) return;
    var o = allOrders.filter(function(x){ return x.ref === b.dataset.ref; })[0];
    if(o) openInvoice(o);
  });

  /* two-step inline confirm — browser dialog blockers can't touch it */
  function note(b, text){
    var n = b.parentNode.querySelector('.confnote');
    if(!text){ if(n) n.remove(); return; }
    if(!n){ n = document.createElement('div'); n.className = 'confnote'; b.parentNode.appendChild(n); }
    n.textContent = text;
  }
  function armConfirm(b, message, fn){
    if(b.dataset.armed === '1'){
      b.dataset.armed = '';
      b.classList.remove('armed');
      b.textContent = b.dataset.orig;
      note(b, '');
      fn();
      return;
    }
    b.dataset.orig = b.textContent;
    b.dataset.armed = '1';
    b.classList.add('armed');
    b.textContent = 'Click again to confirm';
    note(b, message);
    setTimeout(function(){
      if(b.dataset.armed === '1'){
        b.dataset.armed = '';
        b.classList.remove('armed');
        b.textContent = b.dataset.orig;
        note(b, '');
      }
    }, 8000);
  }

  function dealerName(code){
    var d = dealersCache.filter(function(x){ return x.code === code; })[0];
    return d ? d.name : code;
  }
  $('dealerrows').addEventListener('click', function(e){
    var b;
    if((b = e.target.closest('.d-edit'))){
      var row = document.querySelector('.editrow[data-for="' + b.dataset.i + '"]');
      if(row) row.hidden = !row.hidden;
      return;
    }
    if((b = e.target.closest('.d-toggle'))){
      var verb = b.dataset.active === 'true' ? 'reactivate' : 'suspend';
      var tb = b;
      armConfirm(tb, 'This will ' + verb + ' ' + dealerName(tb.dataset.code) +
        (verb === 'suspend' ? ' — their login stops working immediately.' : ' — their login starts working again.'), function(){
        tb.disabled = true;
        api('/api/admin/dealer-active', 'POST', { code: tb.dataset.code, active: tb.dataset.active === 'true' })
          .then(loadDealers).catch(function(){ tb.disabled = false; note(tb, 'Failed — try again.'); });
      });
      return;
    }
    if((b = e.target.closest('.e-mult-save'))){
      var mb = b;
      var sel = document.querySelector('.e-mult[data-code="' + mb.dataset.code + '"]');
      var label = sel.options[sel.selectedIndex].text;
      armConfirm(mb, 'Change ' + dealerName(mb.dataset.code) + "'s price level to " + label +
        '. They will see the new prices on their next login.', function(){
        mb.disabled = true;
        api('/api/admin/dealer-mult', 'POST', { code: mb.dataset.code, mult: parseFloat(sel.value) })
          .then(loadDealers).catch(function(){ mb.disabled = false; note(mb, 'Failed — try again.'); });
      });
      return;
    }
    if((b = e.target.closest('.e-promo-save'))){
      var pb = b;
      var pct = parseFloat(document.querySelector('.e-pct[data-code="' + pb.dataset.code + '"]').value);
      var days = parseInt(document.querySelector('.e-days[data-code="' + pb.dataset.code + '"]').value, 10);
      if(!isFinite(pct) || pct <= 0 || !isFinite(days) || days < 1){ note(pb, 'Enter a percent and a number of days first.'); return; }
      var until = new Date(Date.now() + days * 86400000).toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'});
      armConfirm(pb, 'Give ' + dealerName(pb.dataset.code) + ' a ' + pct + '% discount for ' + days +
        ' days (until ' + until + '). It ends automatically.', function(){
        pb.disabled = true;
        api('/api/admin/dealer-promo', 'POST', { code: pb.dataset.code, pct: pct, days: days })
          .then(loadDealers).catch(function(){ pb.disabled = false; note(pb, 'Failed — try again.'); });
      });
      return;
    }
    if((b = e.target.closest('.e-promo-clear'))){
      var cb = b;
      armConfirm(cb, 'Remove the discount from ' + dealerName(cb.dataset.code) + '.', function(){
        cb.disabled = true;
        api('/api/admin/dealer-promo', 'POST', { code: cb.dataset.code, pct: 0 })
          .then(loadDealers).catch(function(){ cb.disabled = false; note(cb, 'Failed — try again.'); });
      });
      return;
    }
    if((b = e.target.closest('.e-contact-save'))){
      var eb = b;
      var pick = function(cls){ return document.querySelector(cls + '[data-code="' + eb.dataset.code + '"]').value.trim(); };
      eb.disabled = true;
      api('/api/admin/dealer-contact', 'POST', { code: eb.dataset.code,
        email: pick('.e-email'), phone: pick('.e-phone'), address: pick('.e-address') })
        .then(function(){ eb.disabled = false; note(eb, ''); eb.textContent = 'Saved ✓';
          setTimeout(function(){ eb.textContent = 'Save contact'; loadDealers(); }, 1200); })
        .catch(function(){ eb.disabled = false; note(eb, 'Failed — try again.'); });
      return;
    }
    if((b = e.target.closest('.e-delete'))){
      var db = b;
      armConfirm(db, 'This DELETES "' + dealerName(db.dataset.code) +
        '" — their access code stops working immediately. Past orders are kept.', function(){
        db.disabled = true;
        api('/api/admin/dealer-delete', 'POST', { code: db.dataset.code })
          .then(loadDealers).catch(function(){ db.disabled = false; note(db, 'Failed — try again.'); });
      });
      return;
    }
  });
})();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LUMIA — Shop</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<script>
/* the shop moved onto the product pages — send old links to the right one */
(function(){
  var m = /^#p\/([a-z]+)$/.exec(location.hash || '');
  var ok = { roman: 1, cellular: 1, pleated: 1, drapery: 1 };
  location.replace(m && ok[m[1]] ? m[1] + '.html' : 'index.html#products');
})();
</script>
</head>
<body>
<p>The shop now lives on the product pages — <a href="index.html#products">continue to the products</a>.</p>
</body>
</html>
